name: Docker

on:
  push:
    branches:
      - develop
      - main
      - "rc/**"
    tags:
      - "release_*"
  workflow_dispatch:

env:
  IMAGE_NAME: crash240192/elist.api

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          path: elist.api

      - name: Checkout Common
        uses: actions/checkout@v4
        with:
          repository: crash240192/EList.Common
          ref: develop
          path: EList.Common

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # rc/1.2.3 → rc-1.2.3 (в Docker tag нельзя /)
            type=match,pattern=rc/(.*),group=1,prefix=rc-
            # git tag release_1.2.3 → image tag release_1.2.3
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: elist.api/Dockerfile
          build-args: |
            PROJECT_DIR=elist.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
